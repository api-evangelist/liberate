workflow_versioning:
  description: Liberate versions customer workflows rather than the platform API. Revisions autosave
    on every change; a Release is cut from the current version or any prior revision, optionally with
    release notes.
  revisions:
    autosave: true
    history_ui: Version History, at the top of the Liberate canvas
  releases:
    created_from:
    - current version
    - any prior revision
    release_notes: supported
  deployment:
    targets:
    - qa
    - production
    ui: release tab, right panel
  rollback:
    supported: true
    scope: workflow releases
    description: Revert to a previous known-good release to address issues found after deployment.
    caveat: 'Entity Management CSV datasets are called out separately in the docs as NOT having
      built-in rollback — once a replaced file becomes current it is used by all QA and production
      workflows referencing it. See https://docs.liberateinc.com/docs/entity-management'
  docs: https://docs.liberateinc.com/docs/release-management
