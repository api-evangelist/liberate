aid: liberate
name: Liberate
description: 'Liberate is an insurance-native AI company building generative voice, email, and SMS
  agents that resolve customer inquiries end-to-end for carriers, agencies, and brokers. Its "system
  of action" handles sales, servicing, and claims — verifying identity, gathering loss details, filing
  FNOL, and driving the downstream workflow — while integrating with core insurance systems such as
  Guidewire, Duck Creek, Vertafore, Applied, EZ Lynx, Salesforce, Insuresoft, TurboRater, Verisk, and
  CoreLogic. Underneath the AI agents sits the Liberate Orchestration Platform, a low-code workflow
  engine where developers compose modular workflows from connections, events, tasks, decision tables,
  and JSONata transformations, then version, release, and deploy them across QA and production
  environments. Workflows are triggered over HTTP with a bearer token against a per-customer
  integration endpoint. Liberate is backed by Redpoint Ventures and states SOC 2, HIPAA, PCI DSS,
  GDPR, and CCPA compliance.'
